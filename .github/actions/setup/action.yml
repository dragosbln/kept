# Checkout is the caller's; this installs the toolchain the repo pins:
# pnpm from package.json's packageManager field, Node 24, the lockfile as is.
name: Set up pnpm and Node
description: pnpm from the packageManager field, Node 24 with the pnpm store cached, frozen install.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
